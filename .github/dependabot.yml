{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "npm",
      "directory": "/",
      "schedule": {
        "interval": "daily",
        "time": "09:00",
        "timezone": "Etc/UTC"
      },
      "open-pull-requests-limit": 3,
      "versioning-strategy": "increase-if-necessary",
      "commit-message": {
        "prefix": "deps"
      },
      "labels": [
        "dependencies",
        "security-remediation"
      ]
    },
    {
      "package-ecosystem": "github-actions",
      "directory": "/",
      "schedule": {
        "interval": "daily",
        "time": "09:30",
        "timezone": "Etc/UTC"
      },
      "open-pull-requests-limit": 2,
      "commit-message": {
        "prefix": "ci"
      },
      "labels": [
        "dependencies",
        "github-actions"
      ]
    }
  ]
}
